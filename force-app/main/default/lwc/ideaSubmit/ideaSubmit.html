<template>
    <div class="aub-shell">
        <div class="aub-shell__glow" aria-hidden="true"></div>
        <div class="aub-shell__noise" aria-hidden="true"></div>

        <header class="aub-header">
            <div class="aub-brand">
                <div class="aub-brand__mark" aria-hidden="true">
                    <svg class="aub-brand__svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M24 8c-5.5 0-10 4.2-10 9.4 0 3.6 2 6.8 4.8 8.4V30c0 1.1.9 2 2 2h6.4c1.1 0 2-.9 2-2v-4.2c2.8-1.6 4.8-4.8 4.8-8.4C34 12.2 29.5 8 24 8z"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linejoin="round"
                            fill="none"
                        />
                        <path d="M18 34h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                        <path d="M20 40h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="aub-brand__text">
                    <span class="aub-brand__name">Be Vocal</span>
                    <span class="aub-brand__product">New idea</span>
                </div>
            </div>
            <div class="aub-header__meta">
                <span class="aub-pill">Share feedback</span>
            </div>
        </header>

        <main class="aub-main">
            <div class="aub-main__inner">
                <div class="aub-step--pad">
                    <lightning-messages></lightning-messages>

                    <h2 class="aub-step__title">Idea details</h2>
                    <p class="aub-step__lede">Tell us what would help customers, teammates, or the product — the more context, the better.</p>

                    <div class="aub-form-panel">
                        <div class="aub-field">
                            <label class="aub-field__label">Title <abbr class="aub-required" title="required">*</abbr></label>
                            <lightning-input
                                type="text"
                                class="aub-input"
                                value={title}
                                onchange={handleTitleChange}
                                variant="label-hidden"
                                placeholder="What's your idea?"
                                required>
                            </lightning-input>
                        </div>
                        <div class="aub-field aub-field--textarea">
                            <label class="aub-field__label">Description <abbr class="aub-required" title="required">*</abbr></label>
                            <lightning-textarea
                                class="aub-textarea"
                                value={description}
                                onchange={handleDescriptionChange}
                                variant="label-hidden"
                                placeholder="Describe your idea (at least 5 words)..."
                                required>
                            </lightning-textarea>
                            <span class="aub-field__hint">Include at least five words describing the idea.</span>
                        </div>
                        <div class="aub-field aub-field--last">
                            <lightning-combobox
                                name="improvementType"
                                label="Improvement Type"
                                value={improvementType}
                                placeholder="Select a classification"
                                options={improvementTypeOptions}
                                onchange={handleImprovementTypeChange}
                                dropdown-alignment="auto"
                                required>
                            </lightning-combobox>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <aside class="aub-note-banner" role="note">
            <p class="aub-note-banner__text">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et
                dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.
            </p>
        </aside>

        <footer class="aub-form-footer">
            <lightning-button
                label="Submit Idea"
                variant="brand"
                class="aub-btn aub-btn--primary"
                onclick={handleSubmit}
                disabled={submitting}>
            </lightning-button>
        </footer>
    </div>
</template>
