<template>
    <lightning-card title={title} icon-name="standard:loan">
        <div class="slds-p-around_medium">
            <div class="slds-form slds-form_stacked">
                <div class="slds-form-element slds-m-bottom_medium">
                    <label class="slds-form-element__label" for="loan-name">Loan Name</label>
                    <div class="slds-form-element__control">
                        <lightning-input
                            id="loan-name"
                            type="text"
                            value={loanName}
                            onchange={handleLoanNameChange}
                            required
                            placeholder="Enter loan name"
                        ></lightning-input>
                    </div>
                </div>
                <div class="slds-form-element slds-m-bottom_medium">
                    <label class="slds-form-element__label" for="principal">Principal Amount</label>
                    <div class="slds-form-element__control">
                        <lightning-input
                            id="principal"
                            type="number"
                            step="0.01"
                            min="0"
                            value={principalAmount}
                            onchange={handlePrincipalChange}
                            placeholder="0.00"
                        ></lightning-input>
                    </div>
                </div>
                <div class="slds-form-element slds-m-bottom_medium">
                    <label class="slds-form-element__label" for="term">Term (Months)</label>
                    <div class="slds-form-element__control">
                        <lightning-input
                            id="term"
                            type="number"
                            min="1"
                            value={termMonths}
                            onchange={handleTermChange}
                            placeholder="e.g. 36"
                        ></lightning-input>
                    </div>
                </div>
                <div class="slds-form-element slds-m-bottom_medium">
                    <label class="slds-form-element__label" for="status">Status</label>
                    <div class="slds-form-element__control">
                        <lightning-combobox
                            id="status"
                            value={status}
                            options={statusOptions}
                            onchange={handleStatusChange}
                        ></lightning-combobox>
                    </div>
                </div>
                <div class="slds-form-element slds-m-bottom_medium">
                    <label class="slds-form-element__label" for="start-date">Start Date</label>
                    <div class="slds-form-element__control">
                        <lightning-input
                            id="start-date"
                            type="date"
                            value={startDate}
                            onchange={handleStartDateChange}
                        ></lightning-input>
                    </div>
                </div>
                <div class="slds-form-element slds-m-bottom_medium">
                    <label class="slds-form-element__label" for="interest-rate">Interest Rate (%)</label>
                    <div class="slds-form-element__control">
                        <lightning-input
                            id="interest-rate"
                            type="number"
                            formatter="decimal"
                            step="0.01"
                            value={interestRate}
                            onchange={handleInterestRateChange}
                            placeholder="e.g. 5.25"
                        ></lightning-input>
                    </div>
                </div>
            </div>
            <p class="slds-m-bottom_medium slds-text-color_weak slds-text-body_small">
                A Legal Entity record will be created linking this account to the loan as Borrower.
            </p>
            <div class="slds-m-top_medium actions">
                <lightning-button
                    variant="neutral"
                    label="Cancel"
                    onclick={handleCancel}
                    disabled={isLoading}
                ></lightning-button>
                <lightning-button
                    variant="brand"
                    label="Create Loan"
                    onclick={handleSubmit}
                    disabled={isSubmitDisabled}
                    class="slds-m-left_x-small"
                ></lightning-button>
            </div>
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Creating loan..." size="small"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
