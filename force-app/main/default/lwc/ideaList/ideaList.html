<template>
    <lightning-card title="Ideas" icon-name="standard:strategy">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                        name="scope"
                        label="View"
                        value={scope}
                        options={scopeOptions}
                        onchange={handleScopeChange}>
                    </lightning-combobox>
                </div>
            </div>

            <lightning-datatable
                key-field="Id"
                data={ideas}
                columns={columns}
                hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>
        </div>
    </lightning-card>
</template>
