<template>
    <div class="aub-step aub-step--pad">
        <h2 class="aub-step__title">Banker review</h2>
        <p class="aub-step__lede">
            Read-only summary of data collected in the wizard. Use Edit to jump back to a step; warnings must be understood before the application moves forward.
        </p>

        <template lwc:if={hasWarnings}>
            <div class="banker-warnings aub-warnings slds-m-bottom_medium" role="region" aria-label="Application warnings">
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                    <lightning-icon
                        icon-name="utility:warning"
                        alternative-text=""
                        size="small"
                        class="banker-warnings__icon slds-m-right_x-small"
                    ></lightning-icon>
                    <span class="slds-text-heading_small">Warnings</span>
                </div>
                <ul class="banker-warnings__list slds-list_dotted slds-m-left_medium">
                    <template for:each={warnings} for:item="w">
                        <li key={w.id} class="slds-m-bottom_xx-small">{w.message}</li>
                    </template>
                </ul>
            </div>
        </template>

        <section class="review-section aub-review-card slds-m-bottom_medium">
            <div class="review-section__head slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <h3 class="aub-review-card__title">Customer</h3>
                <lightning-button variant="neutral" label="Edit" data-step="1" onclick={handleEditSection}></lightning-button>
            </div>
            <dl class="review-dl slds-m-top_small">
                <template for:each={customerSummaryLines} for:item="row">
                    <div key={row.label} class="review-dl__row">
                        <dt class="review-dl__dt">{row.label}</dt>
                        <dd class="review-dl__dd">{row.value}</dd>
                    </div>
                </template>
            </dl>
        </section>

        <section class="review-section aub-review-card slds-m-bottom_medium">
            <div class="review-section__head slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <h3 class="aub-review-card__title">Needs assessment</h3>
                <lightning-button variant="neutral" label="Edit" data-step="2" onclick={handleEditSection}></lightning-button>
            </div>
            <dl class="review-dl slds-m-top_small">
                <template for:each={needsSummaryLines} for:item="row">
                    <div key={row.label} class="review-dl__row">
                        <dt class="review-dl__dt">{row.label}</dt>
                        <dd class="review-dl__dd">{row.value}</dd>
                    </div>
                </template>
            </dl>
        </section>

        <section class="review-section aub-review-card slds-m-bottom_medium">
            <div class="review-section__head slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <h3 class="aub-review-card__title">Parties</h3>
                <lightning-button variant="neutral" label="Edit" data-step="3" onclick={handleEditSection}></lightning-button>
            </div>
            <template lwc:if={partiesSummaryLines.length}>
                <ul class="slds-list_dotted slds-m-top_small slds-m-left_medium">
                    <template for:each={partiesSummaryLines} for:item="line">
                        <li key={line.id}>{line.text}</li>
                    </template>
                </ul>
            </template>
            <template lwc:if={partiesSummaryLinesEmpty}>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">No parties listed.</p>
            </template>
        </section>

        <section class="review-section aub-review-card slds-m-bottom_medium">
            <div class="review-section__head slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <h3 class="aub-review-card__title">Selected products</h3>
                <lightning-button variant="neutral" label="Edit" data-step="4" onclick={handleEditSection}></lightning-button>
            </div>
            <template lwc:if={productsSummaryLines.length}>
                <ul class="slds-list_dotted slds-m-top_small slds-m-left_medium">
                    <template for:each={productsSummaryLines} for:item="line">
                        <li key={line.id}>{line.text}</li>
                    </template>
                </ul>
            </template>
            <template lwc:if={productsSummaryLinesEmpty}>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">No products selected.</p>
            </template>
        </section>

        <section class="review-section aub-review-card slds-m-bottom_medium">
            <div class="review-section__head slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <h3 class="aub-review-card__title">KYC result</h3>
                <lightning-button variant="neutral" label="Edit" data-step="6" onclick={handleEditSection}></lightning-button>
            </div>
            <dl class="review-dl slds-m-top_small">
                <template for:each={kycSummaryLines} for:item="row">
                    <div key={row.label} class="review-dl__row">
                        <dt class="review-dl__dt">{row.label}</dt>
                        <dd class="review-dl__dd">{row.value}</dd>
                    </div>
                </template>
            </dl>
        </section>

        <div class="aub-confirm-panel slds-m-top_medium">
            <lightning-input
                type="checkbox"
                label="I have reviewed and confirm this application is accurate"
                checked={bankerAccurateConfirmed}
                onchange={handleBankerConfirmChange}
            ></lightning-input>
        </div>
    </div>
</template>
